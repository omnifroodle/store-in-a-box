name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Set up
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Contracts
        run: |
          uv run python scripts/check_contracts.py --self-test
          uv run python scripts/check_contracts.py
      - name: Python tests
        run: uv run pytest
      - name: Sync function tests
        run: if [ -d sync/tests ]; then node --test sync/tests/; else echo "no sync/tests yet (WS2)"; fi
      - name: Board check self-test
        run: uv run python scripts/board_check.py --self-test
