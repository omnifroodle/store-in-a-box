name: iOS

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  siabcore:
    # Both Couchbase Lite editions: Community Edition is the default build; Enterprise Edition (the Multipeer
    # Replicator) is the opt-in the demo uses (app/README.md, "Couchbase Lite edition").
    name: SIABCore (iOS simulator, ${{ matrix.edition }})
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        edition: [community, enterprise]
    env:
      SIAB_CBL_EDITION: ${{ matrix.edition }}
    steps:
      - uses: actions/checkout@v7
      - name: Xcode and simulators
        run: |
          xcodebuild -version
          xcrun simctl list devices available iPhone
      - name: Pick the simulator
        # The blueprint's destination is an iPhone 16; a runner image without one falls back to its first iPhone.
        run: |
          if xcrun simctl list devices available | grep -q "iPhone 16 ("; then
            name="iPhone 16"
          else
            name=$(xcrun simctl list devices available | grep -m1 -oE "iPhone [^(]+" | sed 's/ *$//')
          fi
          echo "Using $name"
          echo "SIM_NAME=$name" >> "$GITHUB_ENV"
      - uses: actions/cache@v5
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ matrix.edition }}-${{ hashFiles('app/SIABCore/Package.swift', 'app/SIABCore/Package.resolved') }}
      - name: Test SIABCore (LedgerFixtureTests over contracts/fixtures/ledger)
        run: |
          set -o pipefail
          xcodebuild test -project app/StoreInABox.xcodeproj -scheme SIABCore \
            -destination "platform=iOS Simulator,name=$SIM_NAME" | tee xcodebuild.log
          grep -E "^(PASS|FAIL) " xcodebuild.log
      - name: Check the edition that was built
        # The test bundle and the resolved package must be the edition this job asked for.
        run: |
          if [ "$SIAB_CBL_EDITION" = enterprise ]; then want=couchbase-lite-swift-ee; else want=couchbase-lite-swift; fi
          ls ~/Library/Developer/Xcode/DerivedData/StoreInABox-*/SourcePackages/checkouts/
          test -d ~/Library/Developer/Xcode/DerivedData/StoreInABox-*/SourcePackages/checkouts/$want
      - name: Build the app
        run: |
          xcodebuild build -project app/StoreInABox.xcodeproj -scheme StoreInABox \
            -destination "platform=iOS Simulator,name=$SIM_NAME" CODE_SIGNING_ALLOWED=NO
