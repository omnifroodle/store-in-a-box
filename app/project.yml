# XcodeGen spec for StoreInABox.xcodeproj. The project is generated: edit this file, then run `xcodegen` in app/
# (see README.md) and commit both. Never edit the .xcodeproj by hand.
name: StoreInABox
options:
  bundleIdPrefix: com.example.storeinabox
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
packages:
  SIABCore:
    path: SIABCore
targets:
  StoreInABox:
    type: application
    platform: iOS
    sources:
      - path: StoreInABox
    info:
      path: StoreInABox/Resources/Info.plist
      properties:
        CFBundleDisplayName: Store in a Box
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSBonjourServices:
          - _couchbaseP2P._tcp
        NSLocalNetworkUsageDescription: Store in a Box finds the other tablets and the box on the venue network to share sales and stock.
        NSBluetoothAlwaysUsageDescription: Store in a Box uses Bluetooth to keep the tablets in sync when there is no Wi-Fi.
        NSCameraUsageDescription: Store in a Box scans product and pairing QR codes.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.storeinabox
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - package: SIABCore
        product: SIABCore
  StoreInABoxTests:
    # The screens' view-model tests (WS6), hosted in the app so they can `@testable import StoreInABox`.
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StoreInABoxTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.storeinabox.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: StoreInABox
schemes:
  StoreInABox:
    build:
      targets:
        StoreInABox: all
        StoreInABoxTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StoreInABoxTests
        - package: SIABCore/SIABCoreTests
  SIABCore:
    build:
      targets:
        StoreInABox: [test]
    test:
      config: Debug
      targets:
        - package: SIABCore/SIABCoreTests
